# Started does not mean ready: healthchecks for the API and Postgres.
# TODO 1: db gets a healthcheck with pg_isready -U postgres -d shop (interval 5s, retries 10).
# TODO 2: api waits for db through depends_on with condition: service_healthy.
# TODO 3: api gets a healthcheck on /readyz. node:26-slim has no curl – use node -e with fetch.
# TODO 4: Start with docker compose up -d --wait and watch docker compose ps.
name: werkstatt-shop

services:
  api:
    build: .
    image: shop-api:1.0.0
    environment:
      DATABASE_URL: postgres://postgres:werkstatt@db:5432/shop
    ports:
      - "3000:3000"
    depends_on:
      - db

  db:
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: werkstatt
      POSTGRES_DB: shop
    volumes:
      - db-data:/var/lib/postgresql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

volumes:
  db-data:
