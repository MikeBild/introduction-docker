# Hardened stack: Distroless image, read-only file system, no capabilities.
name: werkstatt-shop

# One logging configuration for all services, reused through a YAML anchor.
x-logging: &logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

services:
  api:
    build: .
    image: shop-api:1.1.0
    logging: *logging
    environment:
      DATABASE_URL: postgres://postgres:werkstatt@db:5432/shop
    ports:
      - "3000:3000"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      db:
        condition: service_healthy
        restart: true
    healthcheck:
      # Distroless has neither a shell nor curl – node itself checks /readyz.
      test: ["CMD", "/nodejs/bin/node", "-e", "fetch('http://localhost:3000/readyz').then((r) => process.exit(r.ok ? 0 : 1))"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  db:
    image: postgres:18
    logging: *logging
    environment:
      POSTGRES_PASSWORD: werkstatt
      POSTGRES_DB: shop
    volumes:
      - db-data:/var/lib/postgresql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "shop"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  db-data:
