name: werkstatt-shop

services:
  api:
    build: .
    image: shop-api:1.0.0
    environment:
      DATABASE_URL: postgres://postgres:werkstatt@db:5432/shop
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
        restart: true
    healthcheck:
      # node:26-slim has no curl – node itself checks /readyz.
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/readyz').then((r) => process.exit(r.ok ? 0 : 1))"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  db:
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: werkstatt
      POSTGRES_DB: shop
    volumes:
      - db-data:/var/lib/postgresql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "shop"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  db-data:
